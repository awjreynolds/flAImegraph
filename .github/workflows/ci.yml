name: Conformance and reference implementation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: node dist/cli.js conformance
      - run: node dist/cli.js demo --out-dir .local/ci-demo
      - run: go tool pprof -top .local/ci-demo/cost.pprof
      - run: go run . ../../.local/ci-demo/evidence.otlp.json 784
        working-directory: tools/verify-otlp
      - run: npm pack --pack-destination .local
      - run: npm install --ignore-scripts --prefix .local/package-smoke .local/flaimegraph-0.2.0.tgz
      - run: node .local/package-smoke/node_modules/flaimegraph/dist/cli.js conformance
      - run: node .local/package-smoke/node_modules/flaimegraph/dist/cli.js demo --out-dir .local/package-demo

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      - run: npm run lint
        working-directory: viewer
      - run: npx tsc --noEmit --incremental false
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
