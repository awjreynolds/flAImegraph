name: Conformance and reference implementation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: node dist/cli.js demo --out-dir .local/usage-demo
      - run: go run cmd/pprof -top .local/usage-demo/usage.pprof
      - run: node dist/cli.js analyze --input examples/dogfood/v04/native-usage.json --out .local/usage-analysis.json
      - run: node dist/cli.js benchmark --baseline examples/dogfood/v04/baseline.json --candidate examples/dogfood/v04/candidate.json --out .local/comparison.json
      - run: node dist/cli.js runway --input examples/dogfood/v04/runway-input.json --out .local/runway.json
      - run: node dist/pricing-cli.js conformance
      - run: node dist/pricing-cli.js demo --out-dir .local/ci-demo
      - run: go run cmd/pprof -top .local/ci-demo/cost.pprof
      - run: go run . ../../.local/ci-demo/evidence.otlp.json 784
        working-directory: tools/verify-otlp
      - run: node dist/pricing-cli.js validate --kind operation-report --input examples/dogfood/v03/files-report.json
      - run: node dist/pricing-cli.js validate --kind operation-report --input examples/dogfood/v03/routing-report.json
      - run: node dist/pricing-cli.js validate --kind operation-report --input examples/dogfood/v03/native-report.json
      - run: go run cmd/pprof -top examples/dogfood/v03/files-operations.pprof
      - run: npm pack --pack-destination .local
      - run: npm install --ignore-scripts --prefix .local/package-smoke .local/flaimegraph-0.5.0.tgz
      - run: node .local/package-smoke/node_modules/flaimegraph/dist/cli.js demo --out-dir .local/package-usage-demo
      - run: node .local/package-smoke/node_modules/flaimegraph/dist/cli.js validate --kind lifecycle --input examples/dogfood/v05/lifecycle.json
      - run: node .local/package-smoke/node_modules/flaimegraph/dist/pricing-cli.js conformance
      - run: node .local/package-smoke/node_modules/flaimegraph/dist/pricing-cli.js demo --out-dir .local/package-demo

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      - run: npm run lint
        working-directory: viewer
      - run: npx tsc --noEmit --incremental false
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
